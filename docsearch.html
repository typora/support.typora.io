<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - Typora Support</title>
    <meta name="description" content="Search Typora documentation, guides, and support articles">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@3">
    <link rel="stylesheet" href="/assets/css/docsearch.css">
    <link href="/assets/css/pure-min.css" rel="stylesheet" />
    <link href="/assets/css/syntax.css" rel="stylesheet" />
    <link href="/assets/css/typora-wiki.css" rel="stylesheet" />
    <link rel="icon" href="/assets/img/favicon-16.png" sizes="16x16" />
    <link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/assets/img/favicon-64.png" sizes="64x64" />
    <link rel="icon" href="/assets/img/favicon-128.png" sizes="128x128" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: #f8f9fa;
            min-height: 100vh;
        }
        
        .header {
            background: #fff;
            border-bottom: 1px solid #e1e5e9;
            padding: 20px 0;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .search-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .search-header h1 {
            color: #2c3e50;
            margin: 0 0 10px 0;
            font-size: 2.5em;
            font-weight: 300;
        }
        
        .search-header p {
            color: #666;
            font-size: 1.1em;
            margin: 0;
        }
        
        .search-container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
            padding: 40px;
            margin: 40px auto;
            max-width: 800px;
        }
        
        .search-box-wrapper {
            margin: 30px 0;
        }
        
        .search-tips {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        
        .tip-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
        }
        
        .tip-card h3 {
            color: #495057;
            margin: 0 0 10px 0;
            font-size: 1.1em;
        }
        
        .tip-card ul {
            margin: 10px 0 0 0;
            padding-left: 20px;
            list-style-type: disc;
        }
        
        .tip-card li {
            margin: 5px 0;
            color: #666;
        }
        
        .tip-card code {
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 0.9em;
        }
        
        .keyboard-shortcuts {
            background: #e3f2fd;
            border: 1px solid #bbdefb;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
        }
        
        .keyboard-shortcuts strong {
            color: #1976d2;
        }
        
        kbd {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 3px;
            padding: 2px 6px;
            font-family: monospace;
            font-size: 0.9em;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        
        .footer-links {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            border-top: 1px solid #e1e5e9;
        }
        
        .footer-links a {
            color: #007acc;
            text-decoration: none;
            margin: 0 15px;
        }
        
        .footer-links a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .search-container {
                margin: 20px;
                padding: 20px;
            }
            
            .search-header h1 {
                font-size: 2em;
            }
            
            .search-tips {
                grid-template-columns: 1fr;
            }
        }
        
        /* 隐藏加载状态，让页面看起来更干净 */
        .loading-status {
            display: none;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <header class="header">
        <div class="container">
            <nav style="display: flex; align-items: center; justify-content: space-between;">
                <div style="display: flex; align-items: center;">
                    <a href="https://typora.io" style="text-decoration: none; color: #2c3e50; font-size: 1.5em; font-weight: bold;">Typora</a>
                    <span style="margin: 0 15px; color: #ccc;">|</span>
                    <span style="color: #666;">Support Documentation</span>
                </div>
                <div>
                    <a href="/" style="color: #007acc; text-decoration: none; margin-right: 20px;">← Back to Home</a>
                </div>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="search-header" style="margin-top:64px">
            <h1>Search Documentation</h1>
            <p>Find answers, guides, and solutions for Typora</p>
        </div>

        <div class="search-container">
            <div class="search-box-wrapper">
                <div id="docsearch-container"></div>
                <div class="loading-status" id="loading-status">
                    <p style="text-align: center; color: #666;">Loading search...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@docsearch/js@3"></script>
    <script>
        // 初始化 DocSearch
        document.addEventListener('DOMContentLoaded', function() {
            const loadingStatus = document.getElementById('loading-status');
            
            try {
                // 显示加载状态
                loadingStatus.style.display = 'block';
                
                // 初始化 DocSearch
                docsearch({
                    container: '#docsearch-container',
                    appId: 'XOWOYS9WNT',
                    indexName: 'support.typora.io',
                    apiKey: '7048fb83e69f9f32908b8ac30a79977e',
                    placeholder: 'Search documentation...',
                    searchParameters: {
                        facetFilters: []
                    },
                    transformItems(items) {
                        return items.map((item) => {
                            // 可以在这里对搜索结果进行自定义处理
                            return {
                                ...item,
                                url: item.url.replace(/^https?:\/\/[^\/]+/, ''),
                            };
                        });
                    },
                    hitComponent({ hit, children }) {
                        return {
                            type: 'a',
                            props: {
                                href: hit.url,
                                children: children,
                            },
                        };
                    },
                });
                
                // 隐藏加载状态
                setTimeout(() => {
                    loadingStatus.style.display = 'none';
                }, 500);
                
            } catch (error) {
                console.error('DocSearch 初始化失败:', error);
                loadingStatus.innerHTML = '<p style="text-align: center; color: #dc3545;">Search service temporarily unavailable. Please try again later.</p>';
            }
        });
        
        // 全局键盘快捷键
        document.addEventListener('keydown', function(e) {
            // Ctrl+K 或 Cmd+K 打开搜索
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                const searchButton = document.querySelector('.DocSearch-Button');
                if (searchButton) {
                    searchButton.click();
                }
            }
            
            // ESC 键关闭搜索（如果打开）
            if (e.key === 'Escape') {
                const modal = document.querySelector('.DocSearch-Modal');
                if (modal) {
                    const backdrop = document.querySelector('.DocSearch-Container');
                    if (backdrop) {
                        backdrop.click();
                    }
                }
            }
        });
        
        // 自动聚焦到搜索框（如果用户通过 URL 参数传递了查询）
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q') || urlParams.get('query');
        if (query) {
            // 等待 DocSearch 初始化完成后自动打开并填入查询
            setTimeout(() => {
                const searchButton = document.querySelector('.DocSearch-Button');
                if (searchButton) {
                    searchButton.click();
                    setTimeout(() => {
                        const searchInput = document.querySelector('.DocSearch-Input');
                        if (searchInput) {
                            searchInput.value = decodeURIComponent(query);
                            searchInput.dispatchEvent(new Event('input', { bubbles: true }));
                        }
                    }, 200);
                }
            }, 1000);
        }
    </script>
</body>
</html>
