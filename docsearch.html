<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - Typora Support</title>
    <meta name="description" content="Search Typora documentation, guides, and support articles">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@beta">
    <link href="/assets/css/pure-min.css" rel="stylesheet" />
    <link href="/assets/css/syntax.css" rel="stylesheet" />
    <link href="/assets/css/typora-wiki.css" rel="stylesheet" />
    <link rel="icon" href="/assets/img/favicon-16.png" sizes="16x16" />
    <link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/assets/img/favicon-64.png" sizes="64x64" />
    <link rel="icon" href="/assets/img/favicon-128.png" sizes="128x128" />        
</head>
<body>
    <!-- 导航栏 -->
    <header class="header">
        <div class="container">
            <nav style="display: flex; align-items: center; justify-content: space-between;">
                <div style="display: flex; align-items: center;">
                    <a href="https://typora.io" style="text-decoration: none; color: #2c3e50; font-size: 1.5em; font-weight: bold;">Typora</a>
                    <span style="margin: 0 15px; color: #ccc;">|</span>
                    <span style="color: #666;">Support Documentation</span>
                </div>
                <div>
                    <a href="/" style="color: #007acc; text-decoration: none; margin-right: 20px;">← Back to Home</a>
                </div>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="search-header" style="margin-top:64px">
            <h1>Search Documentation</h1>
            <p>Find answers, guides, and solutions for Typora</p>
        </div>

        <div class="search-container">
            <div class="search-box-wrapper">
                <div id="docsearch-container"></div>
                <div class="loading-status" id="loading-status">
                    <p style="text-align: center; color: #666;">Loading search...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@docsearch/js@beta"></script>
    <script>
        // 检测用户语言偏好
        function getUserLanguage() {
            // 获取浏览器语言
            const browserLang = navigator.language || navigator.userLanguage;
            console.log('Browser language:', browserLang);
            
            // 检查 URL 路径
            const currentPath = window.location.pathname;
            if (currentPath.includes('/ja/')) {
                return 'ja';
            }
            if (currentPath.includes('/zh/')) {
                return 'zh';
            }
            
            // 根据浏览器语言判断
            if (browserLang.startsWith('ja')) {
                return 'ja';
            }
            if (browserLang.startsWith('zh')) {
                return 'zh';
            }
            
            return 'en';
        }
        
        // 过滤搜索结果
        function filterSearchResults(items) {
            const userLang = getUserLanguage();
            console.log('User language detected:', userLang);
            
            return items.filter(item => {
                const url = item.url || '';
                
                // 总是包含英文结果（不包含 /ja/ 或 /zh/ 路径的结果）
                const isEnglish = !url.includes('/ja/') && !url.includes('/zh/');
                
                // 根据用户语言包含相应的本地化结果
                const isJapanese = url.includes('/ja/');
                const isChinese = url.includes('/zh/');
                
                switch (userLang) {
                    case 'ja':
                        return isEnglish || isJapanese;
                    case 'zh':
                        return isEnglish || isChinese;
                    default:
                        return isEnglish; // 其他语言只显示英文结果
                }
            });
        }
        
        // 初始化 DocSearch
        document.addEventListener('DOMContentLoaded', function() {
            const loadingStatus = document.getElementById('loading-status');
            
            try {
                // 显示加载状态
                loadingStatus.style.display = 'block';
                
                // 初始化 DocSearch
                docsearch({
                    container: '#docsearch-container',
                    appId: 'XOWOYS9WNT',
                    indexName: 'support.typora.io',
                    apiKey: '7048fb83e69f9f32908b8ac30a79977e',
                    placeholder: 'Search documentation...',
                    debug: true, // 开启调试模式，方便查看问题
                    searchParameters: {
                        facetFilters: [],
                        hitsPerPage: 20, // 每页显示20个结果
                        attributesToHighlight: ['hierarchy.lvl0', 'hierarchy.lvl1', 'hierarchy.lvl2', 'hierarchy.lvl3'],
                        attributesToSnippet: ['content:40'] // 进一步增加内容片段长度
                    },
                    maxResultsPerGroup: 20, // 每组最多显示20个结果
                    resultsFooterComponent: null, // 移除底部组件避免遮挡
                    transformItems(items) {
                        console.log('Raw DocSearch results:', items.length, 'items');
                        
                        // 先进行语言过滤
                        const filteredItems = filterSearchResults(items);
                        console.log('Filtered DocSearch results:', filteredItems.length, 'items');
                        
                        // 然后处理 URL
                        const processedItems = filteredItems.map((item) => {
                            return {
                                ...item,
                                url: item.url.replace(/^https?:\/\/[^\/]+/, ''),
                            };
                        });
                        
                        // 调试输出
                        console.log('Processed results:', processedItems.map(item => ({
                            title: item.hierarchy?.lvl0 || item.hierarchy?.lvl1 || 'No title',
                            url: item.url,
                            content: item.content?.substring(0, 100) + '...'
                        })));
                        
                        return processedItems;
                    }
                });
                
                // 隐藏加载状态
                setTimeout(() => {
                    loadingStatus.style.display = 'none';
                    
                    // 检查搜索按钮是否正确渲染
                    const searchButton = document.querySelector('.DocSearch-Button');
                    if (searchButton) {
                        console.log('DocSearch button rendered successfully');
                        
                        // 添加点击事件监听器用于调试
                        searchButton.addEventListener('click', function() {
                            console.log('DocSearch button clicked');
                        });
                        
                        // 监听搜索输入事件
                        document.addEventListener('keydown', function(e) {
                            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                                console.log('Keyboard shortcut triggered');
                            }
                        });
                        
                    } else {
                        console.error('DocSearch button not found');
                    }
                }, 500);
                
            } catch (error) {
                console.error('DocSearch 初始化失败:', error);
                loadingStatus.innerHTML = '<p style="text-align: center; color: #dc3545;">Search service temporarily unavailable. Please try again later.</p>';
            }
        });
        
        // 全局键盘快捷键
        document.addEventListener('keydown', function(e) {
            // Ctrl+K 或 Cmd+K 打开搜索
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                const searchButton = document.querySelector('.DocSearch-Button');
                if (searchButton) {
                    searchButton.click();
                }
            }
            
            // ESC 键关闭搜索（如果打开）
            if (e.key === 'Escape') {
                const modal = document.querySelector('.DocSearch-Modal');
                if (modal) {
                    const backdrop = document.querySelector('.DocSearch-Container');
                    if (backdrop) {
                        backdrop.click();
                    }
                }
            }
        });
        
        // 自动聚焦到搜索框（如果用户通过 URL 参数传递了查询）
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q') || urlParams.get('query');
        if (query) {
            // 等待 DocSearch 初始化完成后自动打开并填入查询
            setTimeout(() => {
                const searchButton = document.querySelector('.DocSearch-Button');
                if (searchButton) {
                    searchButton.click();
                    setTimeout(() => {
                        const searchInput = document.querySelector('.DocSearch-Input');
                        if (searchInput) {
                            searchInput.value = decodeURIComponent(query);
                            searchInput.dispatchEvent(new Event('input', { bubbles: true }));
                        }
                    }, 200);
                }
            }, 1000);
        }
        
        // 监听 DocSearch 的各种事件
        document.addEventListener('click', function(e) {
            if (e.target.closest('.DocSearch-Button')) {
                console.log('DocSearch modal should open');
                
                // 等待模态框打开
                setTimeout(() => {
                    const modal = document.querySelector('.DocSearch-Modal');
                    const input = document.querySelector('.DocSearch-Input');
                    
                    if (modal) {
                        console.log('DocSearch modal found');
                    } else {
                        console.error('DocSearch modal not found');
                    }
                    
                    if (input) {
                        console.log('DocSearch input found');
                        
                        // 监听输入事件
                        input.addEventListener('input', function(e) {
                            console.log('Search query:', e.target.value);
                        });
                    } else {
                        console.error('DocSearch input not found');
                    }
                }, 100);
            }
        });
        
        // 监听文档变化来检测搜索结果
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.type === 'childList') {
                    const hits = document.querySelectorAll('.DocSearch-Hit');
                    const noResults = document.querySelector('.DocSearch-NoResults');
                    
                    if (hits.length > 0) {
                        console.log(`Found ${hits.length} search results`);
                        hits.forEach((hit, index) => {
                            console.log(`Result ${index + 1}:`, hit.textContent.trim());
                        });
                    }
                    
                    if (noResults) {
                        console.log('No results message displayed');
                    }
                }
            });
        });
        
        // 开始观察文档变化
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    </script>
</body>
</html>
