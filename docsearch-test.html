<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algolia DocSearch Test</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@3">
    <link rel="stylesheet" href="/assets/css/docsearch.css">
</head>
<body>
    <h1>Algolia DocSearch Test Page</h1>
    <p>This page is for testing Algolia DocSearch integration when host is support.typora.io</p>
    
    <div id="docsearch-test"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/@docsearch/js@3"></script>
    <script>
        // Test DocSearch initialization
        if (window.location.host === 'support.typora.io') {
            docsearch({
              container: '#docsearch',
              appId: 'XOWOYS9WNT',
              indexName: 'support.typora.io',
              apiKey: '7048fb83e69f9f32908b8ac30a79977e',
            });
        } else {
            document.getElementById('docsearch-test').innerHTML = 
                '<p style="color: red;">This test only works on support.typora.io domain</p>';
        }
    </script>
</body>
</html>
